services:
  kafka:
    image: apache/kafka:4.2.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    restart: unless-stopped

  strategy-service:
    build:
      context: ../service/strategy_service
      dockerfile: Dockerfile
    container_name: strategy-service
    depends_on:
      - kafka
    environment:
      SYMBOL: BTCUSDT
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MARKET_DATA_TOPIC: market_data
      TRADE_SIGNAL_TOPIC: trade_signal
      CONSUMER_GROUP_ID: strategy-service
      SHORT_WINDOW: 7
      LONG_WINDOW: 25
      QUANTITY: 0.01
      ORDER_TYPE: LIMIT
      LOG_LEVEL: INFO
    restart: unless-stopped

  position-service:
    build:
      context: ../service/position_service
      dockerfile: Dockerfile
    container_name: position-service
    depends_on:
      - kafka
    env_file:
      - ../service/position_service/.env
    environment:
      SYMBOL: BTCUSDT
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EXECUTION_RESULT_TOPIC: execution_result
      MARKET_DATA_TOPIC: market_data
      CONSUMER_GROUP_ID: position-service
      LOG_LEVEL: INFO
    restart: unless-stopped

  market-data-service:
    build:
      context: ../service/market_data_service
      dockerfile: Dockerfile
    container_name: market-data-service
    depends_on:
      - kafka
    environment:
      SYMBOL: BTCUSDT
      BINANCE_WS_BASE_URL: wss://stream.binance.com:443/ws
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MARKET_DATA_TOPIC: market_data
      RECONNECT_DELAY_SECONDS: 3
      LOG_LEVEL: INFO
    restart: unless-stopped

  producer-service:
    build:
      context: ../service/producer_service
    container_name: producer-service
    depends_on:
      - kafka
      - market-data-service
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SYMBOL: BTCUSDT
      QUANTITY: 0.01
      SIGNAL_INTERVAL_SECONDS: 5
    restart: unless-stopped

  kill-switch-service:
    build:
      context: ../service/kill_switch_service
    container_name: kill-switch-service
    depends_on:
      - kafka
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      COOLDOWN_SECONDS: 3
      MAX_POSITION: 1.0
    restart: unless-stopped

  execution-service:
    build:
      context: ../service/execution_service
    container_name: execution-service
    depends_on:
      - kafka
      - kill-switch-service
    env_file:
      - ../service/execution_service/.env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    restart: unless-stopped
